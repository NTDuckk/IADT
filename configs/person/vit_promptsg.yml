MODEL:
  NAME: 'ViT-B-16'
  STRIDE_SIZE: [16, 16]
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on'
  NO_MARGIN: False

  PROMPTSG:
    # ===== PromptSG base =====
    PROMPT_MODE: 'composed'          # train composed; inference có thể đổi simplified khi test
    TEMPERATURE: 0.1
    LAMBDA_SUPCON: 0.5               # giữ lại (PromptSG). IADT sẽ override bằng IADT_LAMBDA_SUPCON bên dưới

    CROSS_ATTN_HEADS: 8
    POST_CA_BLOCKS: 2
    COATTN_TEXT_MODE: "full"         # "full" | "eot"
    COATTN_LAYERS: 2                 # (nếu code chưa dùng thì để vẫn ok)
    REWEIGHT_MODE: "mul_mean1"
    ENABLE_SUPCON_IN_SIMPLIFIED: false
    ATTN_POOL_MODE: "max"
    ATTN_MAP_MODE: "mean_head_mean_text_norm"   # code MIM bạn có dùng

    # ===== IADT enable =====
    ENABLE_IADT: true                # bật nhánh IADT (S* + A*)
    IADT_NUM_QUERIES: 64             # số lượng learnable queries X
    IADT_TOPK: 16                    # chọn top-k attribute tokens
    IADT_ATTR_PATCH_SOURCE: "both"   # "proj" | "final" | "both"

    # ===== IADT losses =====
    IADT_LAMBDA_SUPCON: 0.1          # theo paper IADT (override LAMBDA_SUPCON)
    IADT_LAMBDA_ORTHO: 1.0           # weight cho L_ortho

    # ===== IADT/MIM details =====
    INCLUDE_CLS_IN_KV: true          # KV = [CLS; patches] giống IADT
    REWEIGHT_CLS: true               # cho phép reweight CLS token

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  SEED: 1234
  MARGIN: 0.3

  PROMPTSG:
    IMS_PER_BATCH: 64
    OPTIMIZER_NAME: 'Adam'
    MAX_EPOCHS: 60
    BASE_LR_VISUAL: 0.000005
    BASE_LR_NEW: 0.00005
    WEIGHT_DECAY: 0.0001
    STEPS: [20, 40]
    GAMMA: 0.1
    CHECKPOINT_PERIOD: 5
    LOG_PERIOD: 50
    EVAL_PERIOD: 5
    WARMUP_EPOCHS: 0
    WARMUP_LR_INIT: 0.0

TEST:
  IMS_PER_BATCH: 64
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'after'
  FEAT_NORM: 'yes'

DATASETS:
  NAMES: ('market1501')
  ROOT_DIR: datasets/dataset

OUTPUT_DIR: ('logs/promptsg_market_vit_iadt/')
